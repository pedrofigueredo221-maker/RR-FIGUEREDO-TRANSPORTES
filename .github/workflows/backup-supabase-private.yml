name: Backup criptografado do Supabase no projeto R&R

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */2 * * *"

permissions:
  contents: read

concurrency:
  group: rr-supabase-same-repository-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Verificar segredos obrigatórios
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_PASSWORD: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
        run: |
          test -n "$DB_URL" || { echo "Falta SUPABASE_DB_URL"; exit 1; }
          test -n "$BACKUP_PASSWORD" || { echo "Falta BACKUP_ENCRYPTION_PASSPHRASE"; exit 1; }
      - name: Criar dump PostgreSQL e criptografar antes de enviar
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_PASSWORD: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rr-backup"
          docker run --rm -e DB_URL="$DB_URL" postgres:17 sh -c 'pg_dump --no-owner --no-acl --format=custom --dbname="$DB_URL"' > "$RUNNER_TEMP/rr-backup/supabase.dump"
          test -s "$RUNNER_TEMP/rr-backup/supabase.dump"
          gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3 --symmetric --cipher-algo AES256 --output "$RUNNER_TEMP/rr-backup/supabase.dump.gpg" "$RUNNER_TEMP/rr-backup/supabase.dump" 3<<<"$BACKUP_PASSWORD"
          rm -f "$RUNNER_TEMP/rr-backup/supabase.dump"
      - name: Publicar backup criptografado como artefato privado deste projeto
        uses: actions/upload-artifact@v4
        with:
          name: supabase-backup-${{ github.run_id }}
          path: ${{ runner.temp }}/rr-backup/supabase.dump.gpg
          retention-days: 30
          if-no-files-found: error
